# 演示配置：data/demo 是一个 30 段的虚构《云栖大学学生手册》，用来几分钟内跑通全流程。
# 语料太小，指标没有参考意义；真正的实验用 configs/default.yaml。

data_dir: data/demo
index_dir: indexes/demo

bm25:
  jieba_mode: search
  user_dict: null
  stopwords: null
  k1: 1.2
  b: 0.75

embedder:
  model: BAAI/bge-base-zh-v1.5
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  query_prompt_name: null
  max_seq_length: 512
  batch_size: 32
  fp16: true
  device: null

faiss:
  index_type: flat
  hnsw_m: 16
  hnsw_ef_construction: 100
  hnsw_ef_search: 64
  ivf_nlist: 4
  ivf_nprobe: 2
  pq_m: 16
  pq_nbits: 4

retrieval:
  bm25_top_k: 20
  dense_top_k: 20
  fusion: rrf
  rrf_k: 60
  rrf_use_weights: false
  weights: {bm25: 0.3, dense: 0.7}
  fused_top_k: 20

reranker:
  enabled: true
  model: BAAI/bge-reranker-v2-m3
  top_n: 10
  max_length: 512
  batch_size: 32
  fp16: true
  device: null

generation:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: LLM_API_KEY
  context_top_k: 3
  max_chars_per_doc: 600
  temperature: 0.2

eval:
  split: test
  max_queries: null
  recall_ks: [1, 3, 5, 10]
  seed: 42
