# 默认配置：中文医疗问答检索（mteb/CmedqaRetrieval，约 10 万篇文档、4 千条查询）
# 先运行：python scripts/prepare_data.py --hf mteb/CmedqaRetrieval --out data/cmedqa
# 命令行可以覆盖任何一项：--set reranker.top_n=20

data_dir: data/cmedqa
index_dir: indexes/cmedqa

bm25:
  jieba_mode: search        # search（搜索引擎模式，召回高）| accurate（精确模式）
  user_dict: null           # 领域词典，例如 data/medical_dict.txt（每行：词 词频 词性）
  stopwords: null           # 停用词表，每行一个词
  k1: 1.2                   # 词频饱和参数
  b: 0.75                   # 文档长度归一化参数

embedder:
  model: BAAI/bge-base-zh-v1.5            # 对比可选：BAAI/bge-large-zh-v1.5、BAAI/bge-m3、微调后的本地路径
  query_instruction: "为这个句子生成表示以用于检索相关文章："   # BGE-zh-v1.5 的查询指令；bge-m3 设为 ""
  query_prompt_name: null                 # Qwen3-Embedding 这类自带提示词的模型填 query
  max_seq_length: 512
  batch_size: 128
  fp16: true                              # 仅在 GPU 上生效
  device: null                            # null = 自动（cuda > mps > cpu）

faiss:
  index_type: flat          # flat | hnsw | ivf | ivfpq
  hnsw_m: 32
  hnsw_ef_construction: 200
  hnsw_ef_search: 128
  ivf_nlist: 1024
  ivf_nprobe: 32
  pq_m: 64                  # 必须整除向量维度（768 维可用 32/48/64/96）
  pq_nbits: 8

retrieval:
  bm25_top_k: 100           # 每一路召回多少条
  dense_top_k: 100
  fusion: rrf               # rrf | weighted
  rrf_k: 10
  rrf_use_weights: true    # true 时 RRF 也乘以下面的权重。等权 RRF 会被弱的一路拖累：先用 scripts/tune_fusion.py 在 dev 上选
  weights: {bm25: 0.1, dense: 0.9}   # 加权融合的权重：只在 dev 上调
  fused_top_k: 100          # 不能小于 reranker.top_n 和最大的 recall_k

reranker:
  enabled: true
  model: BAAI/bge-reranker-v2-m3          # 更快的选择：BAAI/bge-reranker-base
  top_n: 50                 # 只重排融合结果的前 top_n 条（效果和延迟的主要旋钮）
  max_length: 512
  batch_size: 64
  fp16: true
  device: null

generation:
  base_url: https://api.deepseek.com      # 任意 OpenAI 兼容接口；本地 Ollama: http://localhost:11434/v1
  model: deepseek-flash                   # 以服务商文档为准；Ollama 例如 qwen3:8b
  api_key_env: LLM_API_KEY                # 从这个环境变量读 key，不要把 key 写进代码或配置
  context_top_k: 5
  max_chars_per_doc: 600
  temperature: 0.2
  thinking: null            # 写回答时是否开思考：null=服务商默认（deepseek-flash 默认开）；false 关；true 开

agent:                      # answer_with_check：资料判成 充分/部分/部分（查不到）/无关；只有"部分"才补检索，只有无关才拒答
  max_rounds: 2             # "部分"时最多额外检索几轮
  refine: hyde              # 补检索的写法：hyde = 写一段像医生回答的口语文字；query = 写一句口语化查询
  merge: slots              # 新文档怎么并进资料：slots = 保留名额，替换原资料里排最后的；rerank = 旧做法，新旧一起按原问题重排
  new_slots: 2              # slots 模式下每轮给新文档的名额（原资料至少保留前 2 条）
  max_irrelevant_retries: 1 # "无关"时先再试几轮（可能只是没检索对），仍无关才拒答
  thinking: false           # 充分性检查、改写查询这类判断步骤是否开思考（关掉更快更便宜）
  max_tokens: 1024          # 判断步骤的输出上限；开思考时要留够

hierarchical:               # 父子分块（rag/advanced/hierarchical.py，scripts/eval_hierarchical.py）：子块建索引，命中后返回父块
  parent_size: 1200         # 父块字数（给大模型的上下文单位，父块之间不重叠）
  child_size: 300           # 子块字数（检索单位）
  child_overlap: 50         # 相邻子块重叠字数
  agg: max                  # 子块 -> 父块：max 取最高分；sum 求和（偏向命中多个子块的父块）
  child_k: 200              # 每一路召回多少个子块（子块比文档多，召回要比 bm25_top_k / dense_top_k 深一些）

router:                     # 大小模型路由（rag/advanced/router.py，scripts/eval_router.py）：小模型分类 -> 闲聊/知识库外不检索，简单题小模型写回答，复杂题大模型
  kb_description: "网上医疗问答社区里医生对患者提问的回答（常见病的症状、病因、用药、检查、日常护理和饮食建议）"
  small:                    # 小模型：字段同 generation，没写的沿用 generation（context_top_k、max_chars_per_doc 等）
    base_url: http://localhost:11434/v1   # 本地 Ollama（先 ollama pull qwen3:4b）；也可以换成便宜的 API 模型
    model: qwen3:4b
    api_key_env: SMALL_LLM_API_KEY        # 本地服务不需要 key
    thinking: null          # Ollama 不认 DeepSeek 的 thinking 参数，保持 null；<think> 段会在解析时去掉
    # 关思考（开着思考分类一条要几十秒、上千 token）：先跑 python scripts/eval_router.py probe，按推荐取消下面某一行的注释
    # prompt_suffix: " /no_think"         # Qwen3 混合思考模型的软开关
    # extra_body: {think: false}          # Ollama 的思考开关（取决于 Ollama 版本是否支持）
  classify_max_tokens: null # 分类的输出上限；小模型开思考时不要设太小，思考被截断就解析不出类别（按 complex 处理）

eval:
  split: test               # 最终报告只看 test；调参用 --split dev
  max_queries: null         # 调试时可以先用 200
  recall_ks: [5, 10, 20, 100]
  seed: 42
